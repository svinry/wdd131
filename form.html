<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Product Review | WDD 131</title>
        <meta name="author" content="Shingirai Alvin Svinurai">
        <meta name="description" content="A page for submitting product reviews, displaying the use of responsive web design principles.">
        <link rel="stylesheet" href="styles/form.css">
        <script src="scripts/form.js" defer></script>
        <script src="scripts/getdates.js" defer></script>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    
    </head>
    <body>
        <div class="page-layout">
            <header>
                <h1>Product Review</h1>
            </header>
            <main>
            <form method="get" action="review.html">
                <h2>Share your experience</h2>
                <p class="form-intro">Tell us what you think about your product.</p>
                <p class="required-instructions"><span class="required-marker" aria-hidden="true">*</span> Required fields</p>
                <label for="productName">Product Name <span class="required-marker" aria-hidden="true">*</span></label>
                <select id="productName" name="productName" required>
                    <option value="" disabled selected>Select a Product ...</option>
                </select>

                <fieldset class="rating-fieldset">
                    <legend>Overall Rating <span class="required-marker" aria-hidden="true">*</span></legend>
                    <div class="rating-options" role="radiogroup" aria-label="Overall rating">
                        <input type="radio" id="rating-5" name="rating" value="5" required>
                        <label for="rating-5" title="5 stars"><span class="visually-hidden">5 stars</span><span aria-hidden="true">★</span></label>
                        <input type="radio" id="rating-4" name="rating" value="4" required>
                        <label for="rating-4" title="4 stars"><span class="visually-hidden">4 stars</span><span aria-hidden="true">★</span></label>
                        <input type="radio" id="rating-3" name="rating" value="3" required>
                        <label for="rating-3" title="3 stars"><span class="visually-hidden">3 stars</span><span aria-hidden="true">★</span></label>
                        <input type="radio" id="rating-2" name="rating" value="2" required>
                        <label for="rating-2" title="2 stars"><span class="visually-hidden">2 stars</span><span aria-hidden="true">★</span></label>
                        <input type="radio" id="rating-1" name="rating" value="1" required>
                        <label for="rating-1" title="1 star"><span class="visually-hidden">1 star</span><span aria-hidden="true">★</span></label>
                    </div>
                </fieldset>

                <label for="installDate">Date of Installation <span class="required-marker" aria-hidden="true">*</span></label>
                <input type="date" id="installDate" name="installDate" required>

                <fieldset class="features-fieldset">
                    <legend>Useful Features <span class="optional-note">(select all that apply)</span></legend>
                    <label class="checkbox-option" for="feature-durability">
                        <input type="checkbox" id="feature-durability" name="features" value="durability">
                        Durability
                    </label>
                    <label class="checkbox-option" for="feature-ease">
                        <input type="checkbox" id="feature-ease" name="features" value="ease-of-use">
                        Ease of use
                    </label>
                    <label class="checkbox-option" for="feature-performance">
                        <input type="checkbox" id="feature-performance" name="features" value="performance">
                        Performance
                    </label>
                    <label class="checkbox-option" for="feature-design">
                        <input type="checkbox" id="feature-design" name="features" value="design">
                        Design
                    </label>
                </fieldset>

                <label for="writtenReview">Written Review <span class="optional-note">(optional)</span></label>
                <textarea id="writtenReview" name="writtenReview" rows="5" placeholder="What did you like or what could be better?"></textarea>

                <label for="userName">Your Name <span class="optional-note">(optional)</span></label>
                <input type="text" id="userName" name="userName" autocomplete="name">

                <input class="submit-button" type="submit" value="Submit Review">
            </form>
            </main>
            <footer>
                <p>&copy;<span id="currentYear"></span> - Alvin Svinurai - Zimbabwe</p>
                <p id="lastModified"></p>
            </footer>
        </div>
    </body>
</html>
